<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css">
    <style>
        body { background: #f5f7fb; }
        .card { border: 0; box-shadow: 0 0 18px rgba(49, 53, 83, .08); }
        .sidebar { min-height: 100vh; background: #0d6efd; color: #fff; }
        .sidebar a { color: rgba(255,255,255,.9); }
        .sidebar a.active, .sidebar a:hover { color: #fff; text-decoration: none; }
        .table-sm th, .table-sm td { padding: .5rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Material Management Portal</a>

        <div class="d-flex">
            {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light me-2">Login</a>
                <a href="{% url 'register' %}" class="btn btn-success">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-lg-2 mb-3">
            <div class="sidebar p-3 rounded">
                <h5 class="text-white">Navigation</h5>
                <div class="nav flex-column">
                    <a class="nav-link active" href="/">Dashboard</a>
                    <a class="nav-link" href="/materials/issue/">Material Issue</a>
                    <a class="nav-link" href="/materials/consume/">Material Installation</a>
                    <a class="nav-link" href="/dpr/">Daily DPR</a>
                    <a class="nav-link" href="/expenses/">Expense Entry</a>
                    <a class="nav-link" href="/reports/">Reports</a>
                </div>
            </div>
        </div>
        <div class="col-lg-10">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
