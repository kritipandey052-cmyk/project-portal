{% extends 'portal/base.html' %}
{% block content %}
<div class="card p-4">
    <h4>Material Installation / Consumption Entry</h4>
    <form method="post" class="row g-3 mt-2">
        {% csrf_token %}
        <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Receiver / Manpower</label><input type="text" name="person" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Site / Installation Location</label><input type="text" name="site_name" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Material</label><input type="text" name="material_description" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Size / Diameter</label><input type="text" name="material_size" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Issued Quantity</label><input type="number" step="0.01" name="issued_quantity" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Installed / Consumed Quantity</label><input type="number" step="0.01" name="installed_quantity" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Remaining Quantity</label><input type="number" step="0.01" name="remaining_quantity" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Remarks</label><input type="text" name="remarks" class="form-control"></div>
        <div class="col-12 text-end"><button type="submit" class="btn btn-primary">Save Installation</button></div>
    </form>
</div>
{% endblock %}
