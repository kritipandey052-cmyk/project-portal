{% extends 'portal/base.html' %}
{% block content %}
<div class="card p-4">
    <h4>Material Issue Entry</h4>
    <form method="post" class="row g-3 mt-2">
        {% csrf_token %}
        <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Receiver / Manpower</label><input type="text" name="person" class="form-control" placeholder="Sumit" required></div>
        <div class="col-md-4"><label class="form-label">Material Category</label><input type="text" name="material_category" class="form-control" placeholder="Fitting"></div>
        <div class="col-md-4"><label class="form-label">Material Description</label><input type="text" name="material_description" class="form-control" placeholder="Reducer"></div>
        <div class="col-md-4"><label class="form-label">Size / Diameter</label><input type="text" name="material_size" class="form-control" placeholder="1/2\""></div>
        <div class="col-md-4"><label class="form-label">Unit</label><input type="text" name="unit" class="form-control" placeholder="Nos"></div>
        <div class="col-md-4"><label class="form-label">Issued Quantity</label><input type="number" step="0.01" name="issued_quantity" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Installation Location / Site Name</label><input type="text" name="site_name" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Remarks</label><input type="text" name="remarks" class="form-control"></div>
        <div class="col-12 text-end"><button type="submit" class="btn btn-primary">Save Issue</button></div>
    </form>
</div>
{% endblock %}
