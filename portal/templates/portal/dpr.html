{% extends 'portal/base.html' %}
{% block content %}
<div class="card p-4">
    <h4>Daily DPR Entry</h4>
    <form method="post" class="row g-3 mt-2">
        {% csrf_token %}
        <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Person</label><input type="text" name="person" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">RFC Quantity</label><input type="number" step="0.01" name="rfc_quantity" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">NG Quantity</label><input type="number" step="0.01" name="ng_quantity" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">TF Quantity</label><input type="number" step="0.01" name="tf_quantity" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">GI Installation Quantity</label><input type="number" step="0.01" name="gi_quantity" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Remarks</label><input type="text" name="remarks" class="form-control"></div>
        <div class="col-12 text-end"><button type="submit" class="btn btn-primary">Save DPR</button></div>
    </form>
</div>
{% endblock %}
