{% extends 'portal/base.html' %}
{% block content %}
<div class="card p-4">
    <h4>Expense Entry</h4>
    <form method="post" class="row g-3 mt-2">
        {% csrf_token %}
        <div class="col-md-4"><label class="form-label">Date</label><input type="date" name="date" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Person</label><input type="text" name="person" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Expense Category</label><input type="text" name="category" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Description</label><input type="text" name="description" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Amount</label><input type="number" step="0.01" name="amount" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label">Site / Location</label><input type="text" name="site_name" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Bill / Receipt Reference</label><input type="text" name="reference" class="form-control"></div>
        <div class="col-md-4"><label class="form-label">Remarks</label><input type="text" name="remarks" class="form-control"></div>
        <div class="col-12 text-end"><button type="submit" class="btn btn-primary">Save Expense</button></div>
    </form>
</div>
{% endblock %}
