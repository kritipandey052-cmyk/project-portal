        <circle cx="120" cy="220" r="170" fill="none" stroke="#0f5fba" stroke-width="30"/>
        <circle cx="120" cy="220" r="110" fill="none" stroke="#f3f3f1" stroke-width="26"/>
        <path d="M120 220 L180 150" stroke="#f77b1d" stroke-width="16" stroke-linecap="round"/>
        <circle cx="120" cy="220" r="20" fill="#f77b1d"/>
        <path d="M120 35 C155 35 186 96 186 150 C186 175 178 198 163 216 L120 220 L78 215 C63 198 55 175 55 150 C55 96 86 35 120 35 Z" fill="none" stroke="#0f5fba" stroke-width="28"/>
        <path d="M120 10 L120 65 M105 360 L135 360 M40 220 L88 220 M152 220 L200 220" stroke="#0f5fba" stroke-width="10" stroke-linecap="round"/>
        <path d="M0 0 L0 355" fill="none" stroke="#f3f3f1" stroke-width="30" stroke-linecap="round"/>
        <path d="M120 390 L120 520" stroke="#0f5fba" stroke-width="25" stroke-linecap="round"/>
        <path d="M120 520 C100 520 83 529 72 542 C61 555 58 573 64 588 C71 604 89 613 110 611 C130 610 145 601 153 586 C161 572 160 557 152 545 C143 533 133 520 120 520 Z" fill="#3ec7ff"/>
