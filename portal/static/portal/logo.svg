        <path d="M58 0 C35 25 30 48 34 70 C38 90 58 105 72 118 C82 105 97 84 97 60 C97 41 87 20 58 0 Z" fill="#f3f3f1"/>
        <path d="M73 36 C65 52 65 72 74 88 C80 77 94 62 94 46 C94 39 87 31 73 36 Z" fill="#f77b1d"/>
      </g>
    </g>

    <!-- Right P in blue -->
    <g transform="translate(1080,0)">
      <path d="M80 520 L80 150 L315 150 Q430 150 430 240 Q430 330 315 330 L212 330 L212 520 Z"
            fill="#0f5fba"/>
      <path d="M212 150 L212 520 L80 520 L80 150 Z" fill="#0f5fba"/>
      <path d="M212 150 L380 150 L380 240 L212 240 Z" fill="#f3f3f1"/>
      <path d="M212 150 L380 150 L380 240 L212 240 Z" fill="#f3f3f1"/>
      <path d="M0 220 L0 400 C0 470 55 490 105 490 C155 490 210 470 210 400 L210 220 Z" fill="none" stroke="#f3f3f1" stroke-width="18" opacity="0.2"/>

