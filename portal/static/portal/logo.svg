<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">MEP Dream Construction Logo</title>
  <desc id="logoDesc">Stylized MEP construction theme with wrench, fire, pipe, and gauge.</desc>

  <rect width="1600" height="700" fill="#f3f3f1"/>

  <g transform="translate(0,10)">
    <!-- Left M in navy -->
    <path d="M90 520 L90 150 L260 150 L380 310 L500 150 L620 150 L620 520 L470 520 L470 325 L365 470 L305 470 L200 325 L200 520 Z"
          fill="#0d2d5c"/>

    <!-- White cutout wedge for M -->
    <path d="M200 150 L360 150 L255 325 L200 325 Z M500 150 L620 150 L470 325 L415 325 Z"
          fill="#f3f3f1"/>

    <!-- Wrench icon -->
    <g transform="translate(0,0)">
      <path d="M190 215 L150 255 L105 210 L150 165 Z" fill="#f3f3f1"/>
      <path d="M160 150 C120 120 65 125 35 160 L95 220 C125 190 150 180 180 185 L160 150 Z" fill="#f3f3f1"/>
      <circle cx="104" cy="220" r="30" fill="none" stroke="#f3f3f1" stroke-width="22"/>
      <path d="M105 250 L105 315" stroke="#f3f3f1" stroke-width="18" stroke-linecap="round"/>
      <path d="M75 295 L105 315 L135 295" stroke="#f3f3f1" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Building detail in the M negative space -->
    <g transform="translate(230,210)" fill="#0d2d5c">
      <rect x="0" y="120" width="110" height="135" rx="4" fill="#f3f3f1"/>
      <rect x="18" y="145" width="22" height="22" fill="#0d2d5c"/>
      <rect x="46" y="145" width="22" height="22" fill="#0d2d5c"/>
      <rect x="74" y="145" width="22" height="22" fill="#0d2d5c"/>
      <rect x="18" y="175" width="22" height="22" fill="#0d2d5c"/>
      <rect x="46" y="175" width="22" height="22" fill="#0d2d5c"/>
      <rect x="74" y="175" width="22" height="22" fill="#0d2d5c"/>
      <rect x="46" y="100" width="22" height="18" fill="#0d2d5c"/>
      <rect x="35" y="80" width="44" height="22" fill="#0d2d5c"/>
    </g>

    <!-- Center E in orange -->
    <g transform="translate(630,0)">
      <path d="M80 520 L80 150 L560 150 L560 245 L210 245 L210 315 L500 315 L500 410 L210 410 L210 520 Z"
