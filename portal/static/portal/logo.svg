      <path d="M260 120 L500 120 L500 190 L260 190 Z" fill="#f3f3f1"/>
      <path d="M260 350 L480 350 L480 420 L260 420 Z" fill="#f3f3f1"/>
      <path d="M260 218 L470 218 L470 280 L260 280 Z" fill="#f3f3f1"/>
      <path d="M220 150 L600 150 L600 520 L220 520 Z" fill="none" stroke="#f3f3f1" stroke-width="18" opacity="0.15"/>
